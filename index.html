<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Free Note - made by bad guy</title>
    <link rel="icon" href="unnamed-1.jpg">
    
    <script src="https://www.gstatic.com/firebasejs/9.15.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.15.0/firebase-database-compat.js"></script>
    
    <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>
    
    <style>
        body {
            background-color: #000;
            margin: 0;
            padding: 0;
            font-family: sans-serif;
            overflow: hidden;
            color: white;
            touch-action: none;
        }

        /* --- MATRIX LOADER (GIỮ NGUYÊN TỪNG DÒNG) --- */
        #loader-wrapper {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            background: #000;
            z-index: 30000;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            transition: opacity 0.8s ease-out;
        }

        #matrix-canvas {
            position: absolute;
            top: 0;
            left: 0;
        }

        #loader-text {
            position: relative;
            color: #00ff00;
            font-family: monospace;
            font-size: 20px;
            text-shadow: 0 0 10px #00ff00;
            z-index: 30001;
            font-weight: bold;
            letter-spacing: 2px;
        }

        /* --- WELCOME POPUP CẦU VỒNG (THÊM MỚI NHƯNG VIẾT TÁCH DÒNG) --- */
        #welcome-popup {
            position: fixed;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%) scale(0.8);
            width: 320px;
            background: rgba(15, 15, 15, 0.98);
            border: 2px solid #333;
            border-radius: 20px;
            padding: 40px 20px;
            z-index: 25000;
            text-align: center;
            box-shadow: 0 0 40px rgba(0, 0, 0, 0.9);
            opacity: 0;
            visibility: hidden;
            transition: all 0.5s cubic-bezier(0.175, 0.885, 0.32, 1.275);
        }

        #welcome-popup.open {
            opacity: 1;
            visibility: visible;
            transform: translate(-50%, -50%) scale(1);
        }

        #welcome-popup h2 {
            margin: 0;
            margin-bottom: 25px;
            font-size: 24px;
            font-weight: bold;
            background: linear-gradient(
                to left, 
                #ff0000, 
                #ff7f00, 
                #ffff00, 
                #00ff00, 
                #0000ff, 
                #4b0082, 
                #8b00ff
            );
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-size: 400% 400%;
            animation: rainbow-flow 5s linear infinite;
        }

        @keyframes rainbow-flow {
            0% {
                background-position: 0% 50%;
            }
            100% {
                background-position: 100% 50%;
            }
        }

        /* Dấu X bất hủ của ông đây */
        .close-welcome {
            position: absolute;
            top: 15px;
            right: 20px;
            cursor: pointer;
            color: #666;
            font-size: 22px;
            font-weight: bold;
            transition: 0.3s;
        }

        .close-welcome:hover {
            color: #fff;
            transform: rotate(90deg);
        }

        .welcome-btn {
            background: #fff;
            color: #000;
            border: none;
            padding: 12px 40px;
            border-radius: 30px;
            font-weight: bold;
            cursor: pointer;
            font-size: 15px;
            transition: 0.3s;
            box-shadow: 0 4px 15px rgba(255, 255, 255, 0.1);
        }

        .welcome-btn:hover {
            background: #00ff00;
            transform: translateY(-3px);
        }

        /* --- UI COMPONENTS (HỒI PHỤC TRẠNG THÁI DÀI) --- */
        #guide-box {
            position: fixed;
            top: 20px;
            left: 20px;
            width: fit-content;
            background: rgba(30, 30, 30, 0.9);
            border: 1px solid #444;
            border-radius: 10px;
            padding: 12px 18px;
            z-index: 2000;
            font-size: 13px;
        }

        #guide-box h3 {
            margin: 0;
            margin-bottom: 5px;
            color: #00ff00;
            font-size: 16px;
        }

        .admin-link {
            background: linear-gradient(90deg, #00ff00, #00d4ff, #00ffbc, #00ff00);
            background-size: 300% 300%;
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            text-decoration: none;
            font-weight: bold;
            animation: moveGradient 4s linear infinite;
        }

        @keyframes moveGradient {
            0% {
                background-position: 0% 50%;
            }
            100% {
                background-position: 100% 50%;
            }
        }

        #viewport {
            width: 100vw;
            height: 100vh;
            position: relative;
            overflow: hidden;
            cursor: grab;
        }

        #viewport:active {
            cursor: grabbing;
        }

        #wall {
            position: absolute;
            width: 10000px;
            height: 10000px;
            top: 0;
            left: 0;
            background-image: radial-gradient(#333 1px, transparent 1px);
            background-size: 50px 50px;
            transform-origin: 0 0;
        }

        .sticky-note {
            width: 180px;
            min-height: 80px;
            padding: 10px;
            position: absolute;
            color: #000;
            border-radius: 8px;
            box-shadow: 0 4px 10px rgba(0, 0, 0, 0.5);
            font-size: 14px;
            outline: none;
            word-wrap: break-word;
            z-index: 100;
            overflow: hidden;
            resize: both;
            display: flex;
            flex-direction: column;
        }

        .sticky-note img {
            width: 100%;
            height: auto;
            flex-shrink: 1;
            object-fit: contain;
            border-radius: 5px;
            margin-top: 8px;
            pointer-events: none;
        }

        /* --- DOCK & INPUTS --- */
        #dock {
            position: fixed;
            bottom: 0;
            width: 100%;
            height: 110px;
            background: rgba(15, 15, 15, 0.95);
            border-top: 1px solid #333;
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 8px;
            z-index: 1000;
        }

        #note-input {
            width: 110px;
            height: 60px;
            border-radius: 5px;
            border: none;
            padding: 8px;
            font-size: 14px;
        }

        #add-btn {
            background: #fff;
            color: #000;
            border: none;
            font-weight: bold;
            border-radius: 5px;
            height: 60px;
            cursor: pointer;
            padding: 0 15px;
        }

        /* Overlay khi mở popup */
        #page-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            background: rgba(0, 0, 0, 0.7);
            z-index: 7500;
            display: none;
        }
    </style>
</head>

<body>

    <div id="loader-wrapper">
        <canvas id="matrix-canvas"></canvas>
        <div id="loader-text">INITIALIZING SYSTEM...</div>
    </div>

    <div id="welcome-popup">
        <span class="close-welcome" onclick="closeWelcome()">✕</span>
        <h2>✨ Mừng Bạn Đã Trở Lại ✨</h2>
        <button class="welcome-btn" onclick="closeWelcome()">VÀO NGAY</button>
    </div>

    <div id="page-overlay" onclick="closeWelcome()"></div>

    <div id="guide-box">
        <h3>UPDATE - 58 🛸</h3>
        <p>developed by <a href="#" class="admin-link">Tung Lam</a></p>
    </div>

    <div id="viewport">
        <div id="wall"></div>
    </div>

    <div id="dock">
        <div id="timer-container" style="display: flex; flex-direction: column; align-items: center; min-width: 100px; border-right: 1px solid #333; padding-right: 10px;">
            <div id="timer-display" style="font-family: monospace; font-size: 18px; color: #00ff00; font-weight: bold;">00:00:00</div>
            <div style="display: flex; gap: 4px;">
                <button onclick="startTimer()" style="font-size: 10px;">START</button>
                <button onclick="stopTimer()" style="font-size: 10px;">STOP</button>
            </div>
        </div>
        
        <textarea id="note-input" placeholder="Viết..."></textarea>
        
        <input type="color" id="color-picker" value="#ffffff" style="width: 40px; height: 60px;">
        
        <input type="file" id="file-input" accept="image/*" style="display: none;" onchange="uploadImage(this)">
        <button onclick="document.getElementById('file-input').click()" style="height: 60px; width: 40px; cursor: pointer;">🖼️</button>
        
        <button id="add-btn" onclick="sendToCloud()">DÁN</button>
    </div>

    <script>
        /* --- FIREBASE CONFIG (KHÔNG GỘP DÒNG) --- */
        const firebaseConfig = {
            apiKey: "AIzaSyARz3WftjUZ_fRoHn4EcL6k9BGlLNiyMA",
            authDomain: "note-15380.firebaseapp.com",
            databaseURL: "https://note-15380-default-rtdb.firebaseio.com/",
            projectId: "note-15380",
            storageBucket: "note-15380.firebasestorage.app",
            messagingSenderId: "834783700925",
            appId: "1:834783700925:web:63768ddccd55b6c55a94d4"
        };

        firebase.initializeApp(firebaseConfig);
        const db = firebase.database();

        /* --- LOGIC DI CHUYỂN NỀN (VIẾT TÁCH BẠCH) --- */
        const wall = document.getElementById('wall');
        const viewport = document.getElementById('viewport');
        
        let scale = 1;
        let posX = -5000 + window.innerWidth / 2;
        let posY = -5000 + window.innerHeight / 2;
        
        let isDragging = false;
        let lastX = 0;
        let lastY = 0;

        function updateTransform() {
            wall.style.transform = "translate(" + posX + "px, " + posY + "px) scale(" + scale + ")";
        }
        
        updateTransform();

        viewport.addEventListener('mousedown', function(e) {
            isDragging = true;
            lastX = e.clientX;
            lastY = e.clientY;
        });

        window.addEventListener('mousemove', function(e) {
            if (isDragging === true) {
                let dx = e.clientX - lastX;
                let dy = e.clientY - lastY;
                
                posX = posX + dx;
                posY = posY + dy;
                
                lastX = e.clientX;
                lastY = e.clientY;
                
                updateTransform();
            }
        });

        window.addEventListener('mouseup', function() {
            isDragging = false;
        });

        /* --- ĐỒNG BỘ DỮ LIỆU FIREBASE --- */
        function loadNotes() {
            db.ref('notes').on('value', function(snapshot) {
                // Xóa note cũ trên giao diện
                const currentNotes = document.querySelectorAll('.sticky-note');
                for (let i = 0; i < currentNotes.length; i++) {
                    currentNotes[i].remove();
                }

                const data = snapshot.val();
                if (data !== null) {
                    Object.keys(data).forEach(function(key) {
                        const noteData = data[key];
                        createNoteUI(key, noteData);
                    });
                }
            });
        }

        function createNoteUI(id, data) {
            const div = document.createElement('div');
            div.className = 'sticky-note';
            div.style.left = data.x + 'px';
            div.style.top = data.y + 'px';
            div.style.backgroundColor = data.color;
            div.innerText = data.text;

            if (data.image) {
                const img = document.createElement('img');
                img.src = data.image;
                div.appendChild(img);
            }

            div.addEventListener('dblclick', function() {
                if (confirm('Bạn muốn xóa note này?')) {
                    db.ref('notes/' + id).remove();
                }
            });

            wall.appendChild(div);
        }

        /* --- GỬI DỮ LIỆU --- */
        let pendingImage = null;

        function uploadImage(input) {
            const file = input.files[0];
            const reader = new FileReader();
            reader.onload = function(e) {
                pendingImage = e.target.result;
                alert('Đã thêm ảnh, nhấn DÁN để hoàn tất!');
            };
            reader.readAsDataURL(file);
        }

        function sendToCloud() {
            const text = document.getElementById('note-input').value;
            const color = document.getElementById('color-picker').value;

            const newNote = {
                text: text,
                color: color,
                x: ( -posX / scale ) + ( (window.innerWidth / 2) / scale ),
                y: ( -posY / scale ) + ( (window.innerHeight / 2) / scale ),
                image: pendingImage
            };

            db.ref('notes').push(newNote);
            document.getElementById('note-input').value = '';
            pendingImage = null;
        }

        /* --- CÁC HIỆU ỨNG KHÁC --- */
        function showWelcome() {
            document.getElementById('welcome-popup').classList.add('open');
            document.getElementById('page-overlay').style.display = 'block';
            
            confetti({
                particleCount: 150,
                spread: 70,
                origin: { y: 0.6 }
            });
        }

        function closeWelcome() {
            document.getElementById('welcome-popup').classList.remove('open');
            document.getElementById('page-overlay').style.display = 'none';
        }

        // Timer
        let seconds = 0;
        let timer;
        function startTimer() {
            if(!timer) {
                timer = setInterval(function() {
                    seconds++;
                    let h = Math.floor(seconds / 3600);
                    let m = Math.floor((seconds % 3600) / 60);
                    let s = seconds % 60;
                    document.getElementById('timer-display').innerText = 
                        (h < 10 ? "0"+h : h) + ":" + 
                        (m < 10 ? "0"+m : m) + ":" + 
                        (s < 10 ? "0"+s : s);
                }, 1000);
            }
        }
        function stopTimer() {
            clearInterval(timer);
            timer = null;
        }

        // Load ban đầu
        loadNotes();
        setTimeout(showWelcome, 3000);
    </script>
</body>
</html>
