<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <title>Free Note - made by bad guy</title>
    <link rel="icon" href="unnamed-1.jpg">
    <link rel="apple-touch-icon" href="unnamed-1.jpg">
    <script src="https://www.gstatic.com/firebasejs/9.15.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.15.0/firebase-database-compat.js"></script>
    <style>
        body { background-color: #000; margin: 0; overflow: hidden; font-family: sans-serif; touch-action: none; color: white; }
        
        /* Chỉnh lại Viewport để thấy note cũ ngay lập tức */
        #viewport { width: 100vw; height: 100vh; cursor: grab; position: relative; overflow: hidden; }
        #wall { 
            position: absolute; width: 5000px; height: 5000px; 
            top: 0; left: 0; /* Đã đưa về 0 để không bị lạc note cũ */
            background-image: radial-gradient(#333 1px, transparent 1px);
            background-size: 40px 40px; 
        }

        .sticky-note {
            width: 150px; min-height: 100px; padding: 15px;
            position: absolute; color: #000;
            box-shadow: 0 4px 15px rgba(255,255,255,0.2);
            word-wrap: break-word; font-size: 14px; border-radius: 8px;
            cursor: move; user-select: none;
        }

        #dock {
            width: 100vw; height: 120px; background-color: rgba(17, 17, 17, 0.9);
            border-top: 1px solid #333; display: flex;
            justify-content: center; align-items: center; gap: 15px;
            position: fixed; bottom: 0; z-index: 1000;
        }

        .control-group { display: flex; flex-direction: column; gap: 5px; }
        #user-id-input { background: #222; border: 1px solid #444; color: #00ff00; padding: 5px; border-radius: 4px; width: 100px; text-align: center; }
        #note-input { width: 250px; height: 60px; padding: 10px; border-radius: 5px; border: none; }
        #add-btn { background: #fff; border: none; padding: 10px 20px; font-weight: bold; cursor: pointer; border-radius: 5px; height: 100%; }
        
        #mode-toggle {
            background: #222; color: #888; border: 1px solid #444;
            padding: 10px; border-radius: 8px; cursor: pointer;
            text-align: center; min-width: 80px;
        }
    </style>
</head>
<body>

    <div id="viewport">
        <div id="wall"></div>
    </div>

    <div id="dock">
        <div class="control-group">
            <div id="mode-toggle" onclick="toggleMode()">
                Phòng <br> <span id="current-room-text" style="color:#00ff00">CÔNG CỘNG</span>
            </div>
        </div>

        <div class="control-group">
            <label style="font-size: 10px; color: #888;">MÃ CÁ NHÂN:</label>
            <input type="text" id="user-id-input" placeholder="Nhập mã..." onchange="updateUserId(this.value)">
        </div>

        <textarea id="note-input" placeholder="Viết gì đó..."></textarea>
        <input type="color" id="color-picker" value="#ffffff" style="width:40px; height:40px;"> 
        <button id="add-btn" onclick="sendToCloud()">DÁN</button>
    </div>

    <script>
        const firebaseConfig = {
            apiKey: "AIzaSyARz3WftjUZ_fRoHn4EcL6k9BGlLNiyMA",
            authDomain: "note-15380.firebaseapp.com",
            databaseURL: "https://note-15380-default-rtdb.firebaseio.com/", 
            projectId: "note-15380",
            storageBucket: "note-15380.firebasestorage.app",
            messagingSenderId: "834783700925",
            appId: "1:834783700925:web:63768ddccd55b6c55a94d4"
        };
        firebase.initializeApp(firebaseConfig);
        const db = firebase.database();

        let userId = localStorage.getItem('note_user_id') || 'user_' + Math.random().toString(36).substr(2, 5);
        document.getElementById('user-id-input').value = userId;
        localStorage.setItem('note_user_id', userId);

        function updateUserId(val) {
            if(!val.trim()) return;
            userId = val.trim();
            localStorage.setItem('note_user_id', userId);
            if(isPrivate) loadNotes();
            alert("Đã đổi mã cá nhân!");
        }

        const viewport = document.getElementById('viewport');
        const wall = document.getElementById('wall');
        let isPanning = false;
        let startX, startY, wallLeft = 0, wallTop = 0; // Sửa về 0 để đồng bộ note cũ

        viewport.onmousedown = (e) => {
            if(e.target !== viewport && e.target !== wall) return;
            isPanning = true; viewport.style.cursor = 'grabbing';
            startX = e.clientX - wallLeft; startY = e.clientY - wallTop;
        };

        window.onmousemove = (e) => {
            if (!isPanning) return;
            wallLeft = e.clientX - startX; wallTop = e.clientY - startY;
            wall.style.left = wallLeft + 'px'; wall.style.top = wallTop + 'px';
        };

        window.onmouseup = () => { isPanning = false; viewport.style.cursor = 'grab'; };

        let isPrivate = false;
        let currentPath = 'notes';

        function toggleMode() {
            db.ref('notes').off();
            db.ref(`notes/private/${userId}`).off();
            isPrivate = !isPrivate;
            currentPath = isPrivate ? `notes/private/${userId}` : 'notes';
            document.getElementById('current-room-text').innerText = isPrivate ? 'CÁ NHÂN' : 'CÔNG CỘNG';
            document.getElementById('current-room-text').style.color = isPrivate ? '#ff00ff' : '#00ff00';
            loadNotes();
        }

        function loadNotes() {
            const activePath = currentPath;
            db.ref(activePath).on('value', (snapshot) => {
                wall.innerHTML = "";
                const data = snapshot.val();
                if(!data) return;
                Object.keys(data).forEach(id => {
                    if (data[id] && data[id].text) {
                        const note = document.createElement('div');
                        note.className = 'sticky-note';
                        note.innerText = data[id].text;
                        note.style.left = data[id].x; note.style.top = data[id].y;
                        note.style.backgroundColor = data[id].color || '#fff';
                        note.ondblclick = () => { if(confirm("Xóa?")) db.ref(`${activePath}/${id}`).remove(); };
                        makeDraggable(note, id, activePath);
                        wall.appendChild(note);
                    }
                });
            });
        }

        function makeDraggable(el, id, path) {
            let isDragging = false;
            el.onmousedown = (e) => {
                e.stopPropagation(); isDragging = true;
                let sX = e.clientX - el.offsetLeft; let sY = e.clientY - el.offsetTop;
                window.onmousemove = (ev) => {
                    if(!isDragging) return;
                    el.style.left = (ev.clientX - sX) + 'px'; el.style.top = (ev.clientY - sY) + 'px';
                };
                window.onmouseup = () => {
                    if(isDragging) {
                        db.ref(`${path}/${id}`).update({ x: el.style.left, y: el.style.top });
                        isDragging = false;
                    }
                };
            };
        }

        function sendToCloud() {
            const input = document.getElementById('note-input');
            if (!input.value.trim()) return;
            // Dán note vào vị trí người dùng đang nhìn thấy
            const x = (Math.abs(wallLeft) + 50) + 'px';
            const y = (Math.abs(wallTop) + 50) + 'px';
            db.ref(currentPath).push({
                text: input.value, x, y,
                color: document.getElementById('color-picker').value
            });
            input.value = "";
        }
        loadNotes();
    </script>
</body>
</html>
