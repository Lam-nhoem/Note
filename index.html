<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>Free Note - made by bad guy</title>
    <link rel="icon" href="unnamed-1.jpg">
    <script src="https://www.gstatic.com/firebasejs/9.15.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.15.0/firebase-database-compat.js"></script>
    <style>
        body { 
            background-color: #000; margin: 0; padding: 0;
            font-family: sans-serif; overflow: hidden; color: white; 
            touch-action: none; 
        }

        #guide-box {
            position: fixed; top: 10px; left: 10px;
            width: 230px; background: rgba(25, 25, 25, 0.95);
            border: 1px solid #444; border-radius: 12px;
            padding: 12px; z-index: 2000; font-size: 11px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.8);
        }
        #guide-box h3 { margin: 0; color: #00ff00; font-size: 14px; cursor: pointer; }
        #guide-content { display: block; margin-top: 8px; }
        #guide-box p { margin: 4px 0; color: #ccc; }
        
        .admin-link { color: #00ccff; text-decoration: none; font-weight: bold; }

        #viewport { width: 100vw; height: 100vh; position: relative; overflow: hidden; background: #000; }
        #wall { 
            position: absolute; width: 5000px; height: 5000px; 
            top: 0; left: 0; 
            background-image: radial-gradient(#333 1px, transparent 1px);
            background-size: 50px 50px; 
            transform-origin: 0 0;
        }

        .sticky-note {
            width: 170px; min-height: 100px; padding: 12px;
            position: absolute; color: #000; border-radius: 8px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.4);
            font-size: 14px; cursor: move; word-wrap: break-word;
            z-index: 100; touch-action: none; user-select: none;
            display: flex; align-items: center; justify-content: center;
            text-align: center; font-weight: 500;
        }

        #dock {
            position: fixed; bottom: 0; width: 100%; height: 110px;
            background: rgba(10, 10, 10, 0.98); border-top: 1px solid #333;
            display: flex; justify-content: center; align-items: center; gap: 10px; z-index: 1000;
        }

        #user-id-input { background: #1a1a1a; border: 1px solid #444; color: #00ff00; padding: 6px; border-radius: 5px; width: 70px; text-align: center; }
        #note-input { width: 120px; height: 60px; border-radius: 6px; border: 1px solid #333; background: #fff; padding: 8px; font-size: 14px; color: #000; }
        #add-btn { background: #fff; color: #000; border: none; padding: 0 15px; font-weight: bold; border-radius: 6px; height: 60px; cursor: pointer; }
    </style>
</head>
<body>

    <div id="guide-box">
        <h3>UPDATE.9 👾</h3>
        <div id="guide-content">
            <p>• <b>move:</b> chạm kéo note đi</p>
            <p>• <b>zoom:</b> 2 ngón tay thu phóng</p>
            <p>• <b>delete:</b> gõ 2 lần thật nhanh để xóa</p>
            <p style="font-size: 9px; color: #666;">developed by Tung Lam</p>
        </div>
    </div>

    <div id="viewport"><div id="wall"></div></div>

    <div id="dock">
        <div id="room-btn" onclick="toggleMode()" style="cursor:pointer; text-align:center; font-size:11px;">Phòng <br> <span id="room-status" style="color: #00ff00;">CÔNG CỘNG</span></div>
        <input type="text" id="user-id-input" placeholder="ID...">
        <textarea id="note-input" placeholder="Viết gì đó..."></textarea>
        <input type="color" id="color-picker" value="#ffffff">
        <button id="add-btn" onclick="sendToCloud()">DÁN</button>
    </div>

    <script>
        const firebaseConfig = {
            apiKey: "AIzaSyARz3WftjUZ_fRoHn4EcL6k9BGlLNiyMA",
            authDomain: "note-15380.firebaseapp.com",
            databaseURL: "https://note-15380-default-rtdb.firebaseio.com/", 
            projectId: "note-15380",
            storageBucket: "note-15380.firebasestorage.app",
            messagingSenderId: "834783700925",
            appId: "1:834783700925:web:63768ddccd55b6c55a94d4"
        };
        firebase.initializeApp(firebaseConfig);
        const db = firebase.database();

        let wallLeft = 0, wallTop = 0, scale = 1;
        let isPanning = false, startX, startY;
        const wall = document.getElementById('wall');
        const viewport = document.getElementById('viewport');

        function updateWallTransform() { wall.style.transform = `translate(${wallLeft}px, ${wallTop}px) scale(${scale})`; }

        // Logic kéo nền (Pan) & Zoom
        viewport.addEventListener('touchstart', (e) => {
            if(e.target !== viewport && e.target !== wall) return;
            if (e.touches.length === 2) {
                initialDist = Math.hypot(e.touches[0].pageX - e.touches[1].pageX, e.touches[0].pageY - e.touches[1].pageY);
            } else {
                isPanning = true;
                startX = e.touches[0].clientX - wallLeft; startY = e.touches[0].clientY - wallTop;
            }
        });

        viewport.addEventListener('touchmove', (e) => {
            if (e.touches.length === 2) {
                let currentDist = Math.hypot(e.touches[0].pageX - e.touches[1].pageX, e.touches[0].pageY - e.touches[1].pageY);
                scale *= (currentDist / initialDist);
                scale = Math.min(Math.max(0.2, scale), 3);
                initialDist = currentDist;
                updateWallTransform();
            } else if (isPanning) {
                wallLeft = e.touches[0].clientX - startX; wallTop = e.touches[0].clientY - startY;
                updateWallTransform();
            }
        });

        window.addEventListener('touchend', () => { isPanning = false; });

        function toggleMode() {
            const status = document.getElementById('room-status');
            status.innerText = (status.innerText === 'CÔNG CỘNG') ? 'CÁ NHÂN' : 'CÔNG CỘNG';
            status.style.color = (status.innerText === 'CÁ NHÂN') ? '#ff00ff' : '#00ff00';
            loadNotes();
        }

        function loadNotes() {
            const statusText = document.getElementById('room-status').innerText;
            const typedId = document.getElementById('user-id-input').value.trim() || 'default';
            wall.innerHTML = "";
            const path = (statusText === 'CÁ NHÂN') ? `notes/private/${typedId}` : 'notes';
            
            db.ref(path).on('value', (snapshot) => {
                wall.innerHTML = "";
                const data = snapshot.val();
                if(data) {
                    Object.keys(data).forEach(id => {
                        // Kiểm tra nếu là dữ liệu note cũ hoặc mới đều render được
                        const item = typeof data[id] === 'string' ? {text: data[id], x: '100px', y: '100px'} : data[id];
                        renderNote(id, item, path);
                    });
                }
            });
        }

        function renderNote(id, item, currentPath) {
            const note = document.createElement('div');
            note.className = 'sticky-note';
            note.innerText = item.text || "";
            note.style.left = item.x || '100px';
            note.style.top = item.y || '100px';
            note.style.backgroundColor = item.color || '#fff';
            
            // Logic Double Tap để xóa
            let lastTap = 0;
            note.addEventListener('touchend', (e) => {
                const now = new Date().getTime();
                const diff = now - lastTap;
                if (diff < 300 && diff > 0) {
                    if (confirm("Xóa vĩnh viễn?")) db.ref(`${currentPath}/${id}`).remove();
                }
                lastTap = now;
            });

            makeDraggable(note, db.ref(`${currentPath}/${id}`));
            wall.appendChild(note);
        }

        function makeDraggable(el, ref) {
            let oX, oY;
            el.addEventListener('touchstart', (e) => {
                if(e.touches.length > 1) return;
                oX = e.touches[0].clientX - el.offsetLeft; oY = e.touches[0].clientY - el.offsetTop;
                const move = (ev) => {
                    el.style.left = (ev.touches[0].clientX - oX) + 'px';
                    el.style.top = (ev.touches[0].clientY - oY) + 'px';
                };
                const stop = () => {
                    ref.update({ x: el.style.left, y: el.style.top });
                    window.removeEventListener('touchmove', move); window.removeEventListener('touchend', stop);
                };
                window.addEventListener('touchmove', move); window.addEventListener('touchend', stop);
            });
        }

        function sendToCloud() {
            const input = document.getElementById('note-input');
            if (!input.value.trim()) return;
            const statusText = document.getElementById('room-status').innerText;
            const typedId = document.getElementById('user-id-input').value.trim() || 'default';
            const path = (statusText === 'CÁ NHÂN') ? `notes/private/${typedId}` : 'notes';
            db.ref(path).push({
                text: input.value,
                x: (Math.abs(wallLeft) + 50) / scale + 'px',
                y: (Math.abs(wallTop) + 50) / scale + 'px',
                color: document.getElementById('color-picker').value
            });
            input.value = "";
        }
        loadNotes();
    </script>
</body>
</html>
