<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <title>Free Note - made by bad guy</title>
    
    <link rel="icon" href="unnamed-1.jpg">
    <link rel="apple-touch-icon" href="unnamed-1.jpg">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black">
    <meta name="apple-mobile-web-app-title" content="Free Note">

    <script src="https://www.gstatic.com/firebasejs/9.15.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.15.0/firebase-database-compat.js"></script>
    <style>
        body { background-color: #000; margin: 0; overflow: hidden; font-family: sans-serif; touch-action: none; }
        #wall { width: 100vw; height: 75vh; position: relative; }
        .sticky-note {
            width: 150px; min-height: 100px; padding: 15px;
            position: absolute; color: #000;
            box-shadow: 0 4px 15px rgba(255,255,255,0.3);
            word-wrap: break-word; font-size: 14px; border-radius: 8px;
            cursor: move; user-select: none; z-index: 10;
        }
        #dock {
            width: 100vw; height: 25vh; background-color: #111;
            border-top: 1px solid #333; display: flex;
            justify-content: center; align-items: center; gap: 15px;
            position: fixed; bottom: 0; z-index: 1000;
        }
        #mode-toggle {
            position: absolute; left: 20px; 
            background: #222; color: #888; border: 1px solid #444;
            padding: 8px 12px; border-radius: 8px; cursor: pointer;
            font-size: 11px; display: flex; flex-direction: column; align-items: center;
        }
        #mode-toggle span { font-weight: bold; color: #00ff00; margin-top: 2px; font-size: 14px; }
        #note-input { width: 300px; height: 80px; padding: 10px; font-size: 16px; border: none; outline: none; border-radius: 5px; background: #eee; }
        #color-picker { width: 45px; height: 45px; border: none; cursor: pointer; background: none; }
        #add-btn { background-color: #fff; color: #000; border: none; padding: 15px 25px; font-weight: bold; cursor: pointer; border-radius: 5px; }
    </style>
</head>
<body>
    <div id="wall"></div>
    <div id="dock">
        <div id="mode-toggle" onclick="toggleMode()">
            phòng
            <span id="current-room-text">CÔNG CỘNG</span>
        </div>
        <textarea id="note-input" maxlength="500" placeholder="Viết gì đó..."></textarea>
        <input type="color" id="color-picker" value="#ffffff"> 
        <button id="add-btn" onclick="sendToCloud()">DÁN LÊN</button>
    </div>

    <script>
        const firebaseConfig = {
            apiKey: "AIzaSyARz3WftjUZ_fRoHn4EcL6k9BGlLNiyMA",
            authDomain: "note-15380.firebaseapp.com",
            databaseURL: "https://note-15380-default-rtdb.firebaseio.com/", 
            projectId: "note-15380",
            storageBucket: "note-15380.firebasestorage.app",
            messagingSenderId: "834783700925",
            appId: "1:834783700925:web:63768ddccd55b6c55a94d4"
        };
        firebase.initializeApp(firebaseConfig);
        const db = firebase.database();

        let userId = localStorage.getItem('note_user_id') || ('user_' + Math.random().toString(36).substr(2, 9));
        localStorage.setItem('note_user_id', userId);

        let isPrivate = false;
        let currentPath = 'notes'; 

        function toggleMode() {
            db.ref('notes').off();
            db.ref(`notes/private/${userId}`).off();
            isPrivate = !isPrivate;
            currentPath = isPrivate ? `notes/private/${userId}` : 'notes';
            document.getElementById('current-room-text').innerText = isPrivate ? 'CÁ NHÂN' : 'CÔNG CỘNG';
            document.getElementById('current-room-text').style.color = isPrivate ? '#ff00ff' : '#00ff00';
            document.getElementById('wall').innerHTML = "";
            loadNotes(); 
        }

        function loadNotes() {
            const activePath = currentPath;
            db.ref(activePath).on('value', (snapshot) => {
                const wall = document.getElementById('wall');
                wall.innerHTML = ""; 
                const data = snapshot.val();
                if(!data) return;
                Object.keys(data).forEach(id => {
                    if (data[id] && data[id].text) {
                        const note = document.createElement('div');
                        note.className = 'sticky-note';
                        note.innerText = data[id].text;
                        note.style.left = data[id].x;
                        note.style.top = data[id].y;
                        note.style.backgroundColor = data[id].color || '#fff';
                        note.ondblclick = () => { if(confirm("Xóa?")) db.ref(`${activePath}/${id}`).remove(); };
                        makeDraggable(note, id, activePath);
                        wall.appendChild(note);
                    }
                });
            });
        }

        function makeDraggable(el, id, path) {
            let isDragging = false;
            function startDragging(e) {
                isDragging = true; el.style.zIndex = 1000;
                let clientX = e.type.includes('touch') ? e.touches[0].clientX : e.clientX;
                let clientY = e.type.includes('touch') ? e.touches[0].clientY : e.clientY;
                let sX = clientX - el.getBoundingClientRect().left;
                let sY = clientY - el.getBoundingClientRect().top;
                function onMove(ev) {
                    if (!isDragging) return;
                    let pX = ev.type.includes('touch') ? ev.touches[0].pageX : ev.pageX;
                    let pY = ev.type.includes('touch') ? ev.touches[0].pageY : ev.pageY;
                    el.style.left = pX - sX + 'px'; el.style.top = pY - sY + 'px';
                }
                function onEnd() {
                    if (isDragging) { db.ref(`${path}/${id}`).update({ x: el.style.left, y: el.style.top }); isDragging = false; }
                    document.removeEventListener('mousemove', onMove); document.removeEventListener('touchmove', onMove);
                }
                document.addEventListener('mousemove', onMove);
                document.addEventListener('touchmove', onMove, {passive: false});
                document.addEventListener('mouseup', onEnd); document.addEventListener('touchend', onEnd);
            }
            el.onmousedown = startDragging; el.ontouchstart = startDragging;
        }

        function sendToCloud() {
            const input = document.getElementById('note-input');
            if (!input.value.trim()) return;
            db.ref(currentPath).push({
                text: input.value,
                x: (Math.random() * (window.innerWidth - 170)) + 'px',
                y: (Math.random() * (window.innerHeight * 0.4)) + 'px',
                color: document.getElementById('color-picker').value
            });
            input.value = "";
        }
        loadNotes();
    </script>
</body>
</html>
