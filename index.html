<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <title>Free Note - made by bad guy</title>
    <link rel="icon" href="unnamed-1.jpg">
    <link rel="apple-touch-icon" href="unnamed-1.jpg">
    <script src="https://www.gstatic.com/firebasejs/9.15.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.15.0/firebase-database-compat.js"></script>
    <style>
        body { 
            background-color: #000; margin: 0; padding: 0;
            font-family: sans-serif; overflow: hidden; color: white; touch-action: none;
        }

        /* Bảng hướng dẫn cố định (Static) */
        #guide-box {
            position: fixed; top: 20px; left: 20px;
            width: 200px; background: rgba(30, 30, 30, 0.9);
            border: 1px solid #444; border-radius: 10px;
            padding: 15px; z-index: 2000; font-size: 12px;
            pointer-events: none; /* Để không vướng khi kéo nền */
        }
        #guide-box h3 { margin: 0 0 8px 0; color: #00ff00; font-size: 14px; }
        #guide-box p { margin: 4px 0; color: #bbb; }

        /* Không gian vô hạn */
        #viewport { width: 100vw; height: 100vh; cursor: grab; position: relative; overflow: hidden; }
        #wall { 
            position: absolute; width: 10000px; height: 10000px; 
            top: 0; left: 0; 
            background-image: radial-gradient(#333 1px, transparent 1px);
            background-size: 50px 50px; 
        }

        .sticky-note {
            width: 170px; min-height: 100px; padding: 12px;
            position: absolute; color: #000; border-radius: 8px;
            box-shadow: 0 4px 10px rgba(255,255,255,0.1);
            font-size: 14px; cursor: move; outline: none; word-wrap: break-word;
        }

        #dock {
            position: fixed; bottom: 0; width: 100%; height: 110px;
            background: rgba(15, 15, 15, 0.95); border-top: 1px solid #333;
            display: flex; justify-content: center; align-items: center; gap: 15px; z-index: 1000;
        }

        .input-group { display: flex; flex-direction: column; gap: 4px; }
        #user-id-input { background: #222; border: 1px solid #444; color: #00ff00; padding: 6px; border-radius: 5px; width: 90px; text-align: center; }
        #note-input { width: 250px; height: 60px; border-radius: 5px; border: none; padding: 8px; }
        #add-btn { background: #fff; color: #000; border: none; padding: 0 20px; font-weight: bold; border-radius: 5px; height: 60px; cursor: pointer; }
        
        #room-btn { background: #222; color: #888; border: 1px solid #444; padding: 10px; border-radius: 8px; cursor: pointer; text-align: center; }
    </style>
</head>
<body>

    <div id="guide-box">
        <h3> UPDATE.1 🚀 </h3>
        <p>- <b>infinity space:</b> Nhấn vào vùng đen để di chuyển toàn bộ không gian.</p>
        <p>- <b>private room:</b> Mã Id sẽ đóng vai trò như là tài khoản của bạn, nhập mã id để vào phòng cá nhân, mỗi 1 mã id là 1 phòng cá nhân.</p>
        <p>- <b>edit:</b> Nhấn trực tiếp vào note để sửa nội dung.</p>
    </div>

    <div id="viewport">
        <div id="wall"></div>
    </div>

    <div id="dock">
        <div id="room-btn" onclick="toggleMode()">
            Phòng <br> <span id="room-status" style="color: #00ff00;">CÔNG CỘNG</span>
        </div>
        <div class="input-group">
            <span style="font-size: 9px; color: #777;">MÃ ID:</span>
            <input type="text" id="user-id-input" placeholder="Mã..." onchange="updateUserId(this.value)">
        </div>
        <textarea id="note-input" placeholder="Viết gì đó..."></textarea>
        <input type="color" id="color-picker" value="#ffffff" style="width: 40px; height: 40px; cursor: pointer;">
        <button id="add-btn" onclick="sendToCloud()">DÁN</button>
    </div>

    <script>
        const firebaseConfig = {
            apiKey: "AIzaSyARz3WftjUZ_fRoHn4EcL6k9BGlLNiyMA",
            authDomain: "note-15380.firebaseapp.com",
            databaseURL: "https://note-15380-default-rtdb.firebaseio.com/", 
            projectId: "note-15380",
            storageBucket: "note-15380.firebasestorage.app",
            messagingSenderId: "834783700925",
            appId: "1:834783700925:web:63768ddccd55b6c55a94d4"
        };
        firebase.initializeApp(firebaseConfig);
        const db = firebase.database();

        let userId = localStorage.getItem('note_user_id') || 'user_' + Math.random().toString(36).substr(2, 5);
        document.getElementById('user-id-input').value = userId;
        localStorage.setItem('note_user_id', userId);

        let isPrivate = false;
        let currentPath = 'notes';

        // Xử lý kéo nền (Infinite Canvas)
        const viewport = document.getElementById('viewport');
        const wall = document.getElementById('wall');
        let isPanning = false, startX, startY, wallLeft = 0, wallTop = 0;

        viewport.onmousedown = (e) => {
            if(e.target !== viewport && e.target !== wall) return;
            isPanning = true; viewport.style.cursor = 'grabbing';
            startX = e.clientX - wallLeft; startY = e.clientY - wallTop;
        };
        window.onmousemove = (e) => {
            if (!isPanning) return;
            wallLeft = e.clientX - startX; wallTop = e.clientY - startY;
            wall.style.left = wallLeft + 'px'; wall.style.top = wallTop + 'px';
        };
        window.onmouseup = () => { isPanning = false; viewport.style.cursor = 'grab'; };

        function updateUserId(val) {
            userId = val.trim() || userId;
            localStorage.setItem('note_user_id', userId);
            if(isPrivate) loadNotes();
        }

        function toggleMode() {
            isPrivate = !isPrivate;
            currentPath = isPrivate ? `notes/private/${userId}` : 'notes';
            document.getElementById('room-status').innerText = isPrivate ? 'CÁ NHÂN' : 'CÔNG CỘNG';
            document.getElementById('room-status').style.color = isPrivate ? '#ff00ff' : '#00ff00';
            loadNotes();
        }

        function loadNotes() {
            db.ref(currentPath).on('value', (snapshot) => {
                wall.innerHTML = "";
                const data = snapshot.val();
                if(!data) return;
                Object.keys(data).forEach(id => {
                    const item = data[id];
                    const note = document.createElement('div');
                    note.className = 'sticky-note';
                    note.contentEditable = "true";
                    note.innerText = item.text;
                    note.style.left = item.x; note.style.top = item.y;
                    note.style.backgroundColor = item.color || '#fff';
                    note.onblur = () => db.ref(`${currentPath}/${id}`).update({ text: note.innerText });
                    note.ondblclick = () => { if(confirm("Xóa?")) db.ref(`${currentPath}/${id}`).remove(); };
                    makeDraggable(note, id);
                    wall.appendChild(note);
                });
            });
        }

        function makeDraggable(el, id) {
            let isDragging = false;
            el.onmousedown = (e) => {
                if(document.activeElement === el) return;
                e.stopPropagation(); isDragging = true;
                let sX = e.clientX - el.offsetLeft, sY = e.clientY - el.offsetTop;
                const onMove = (ev) => {
                    if(!isDragging) return;
                    el.style.left = (ev.clientX - sX) + 'px'; el.style.top = (ev.clientY - sY) + 'px';
                };
                const onEnd = () => {
                    if(isDragging) {
                        db.ref(`${currentPath}/${id}`).update({ x: el.style.left, y: el.style.top });
                        isDragging = false;
                    }
                    window.removeEventListener('mousemove', onMove);
                };
                window.addEventListener('mousemove', onMove);
                window.addEventListener('mouseup', onEnd);
            };
        }

        function sendToCloud() {
            const input = document.getElementById('note-input');
            if (!input.value.trim()) return;
            // Dán note vào đúng vị trí đang nhìn thấy
            const x = (Math.abs(wallLeft) + 50) + 'px';
            const y = (Math.abs(wallTop) + 50) + 'px';
            db.ref(currentPath).push({
                text: input.value, x, y,
                color: document.getElementById('color-picker').value
            });
            input.value = "";
        }
        loadNotes();
    </script>
</body>
</html>
