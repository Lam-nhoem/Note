<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Free Note - Update 48 (Original Logic)</title>
    <link rel="icon" href="unnamed-1.jpg">
    <script src="https://www.gstatic.com/firebasejs/9.15.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.15.0/firebase-database-compat.js"></script>
    <style>
        /* GIỮ NGUYÊN CSS GỐC CỦA LÂM */
        body { background-color: #000; margin: 0; padding: 0; font-family: sans-serif; overflow: hidden; color: white; touch-action: none; }
        
        /* Chỉ thêm CSS cho Màn hình chờ & BXH */
        #splash-screen { position: fixed; inset: 0; background: #000; z-index: 9999; display: flex; flex-direction: column; justify-content: center; align-items: center; transition: 0.5s; }
        .login-box { background: #111; padding: 30px; border-radius: 15px; border: 1px solid #333; text-align: center; width: 280px; }
        .login-input { width: 100%; padding: 12px; margin-bottom: 10px; border-radius: 8px; border: 1px solid #444; background: #222; color: #fff; text-align: center; box-sizing: border-box; }
        #enter-btn { width: 100%; padding: 12px; border-radius: 8px; border: none; background: #00ff00; color: #000; font-weight: bold; cursor: pointer; }

        #leaderboard { position: fixed; top: 20px; right: 20px; width: 160px; background: rgba(20, 20, 20, 0.8); border: 1px solid #444; border-radius: 10px; padding: 10px; z-index: 1500; font-size: 11px; }
        .rank-item { display: flex; justify-content: space-between; margin-bottom: 5px; }

        #viewport { width: 100vw; height: 100vh; position: relative; overflow: hidden; cursor: grab; }
        #wall { position: absolute; width: 10000px; height: 10000px; top: 0; left: 0; background-image: radial-gradient(#333 1px, transparent 1px); background-size: 50px 50px; transform-origin: 0 0; }
        
        .sticky-note { width: 180px; padding: 10px; position: absolute; color: #000; border-radius: 8px; box-shadow: 0 4px 10px rgba(0,0,0,0.5); font-size: 14px; outline: none; z-index: 100; overflow: hidden; resize: both; }

        #dock { position: fixed; bottom: 0; width: 100%; height: 110px; background: rgba(15, 15, 15, 0.95); border-top: 1px solid #333; display: flex; justify-content: center; align-items: center; gap: 8px; z-index: 1000; }
        #note-input { width: 140px; height: 60px; border-radius: 5px; border: none; padding: 8px; }
        #study-toast { position: fixed; top: 50%; left: 50%; transform: translate(-50%, -50%); background: rgba(0, 255, 0, 0.9); color: black; padding: 20px; border-radius: 15px; font-weight: bold; z-index: 3000; display: none; }
    </style>
</head>
<body>

    <div id="splash-screen">
        <div class="login-box">
            <h2 style="color:#00ff00">FREE NOTE LOGIN</h2>
            <input type="text" id="user-id-input" class="login-input" placeholder="Nhập ID">
            <input type="password" id="user-pin-input" class="login-input" placeholder="PIN 4 số" maxlength="4">
            <button id="enter-btn" onclick="login()">VÀO WEB</button>
        </div>
    </div>

    <div id="leaderboard">
        <h4 style="margin:0 0 10px 0; color:#ffeb3b; text-align:center;">BXH SIÊNG NĂNG</h4>
        <div id="rank-list"></div>
    </div>

    <div id="study-toast"></div>
    <div id="viewport"><div id="wall"></div></div>
    
    <div id="dock">
        <div id="timer-container" style="text-align:center; padding-right:10px; border-right:1px solid #333;">
            <div id="timer-display" style="color:#00ff00; font-weight:bold;">00:00:00</div>
            <button onclick="startTimer()" style="font-size:10px;">BĐ</button>
            <button onclick="stopTimer()" style="font-size:10px;">DỪNG</button>
        </div>
        <div id="room-btn" onclick="toggleMode()" style="cursor:pointer; font-size:11px; color:#00ff00;">Phòng <br> <span id="room-status">CÔNG CỘNG</span></div>
        <textarea id="note-input"></textarea>
        <input type="color" id="color-picker" value="#ffffff">
        <button id="add-btn" onclick="sendToCloud()" style="height:60px; font-weight:bold;">DÁN</button>
    </div>

    <script>
        // FIREBASE CONFIG (Giữ nguyên)
        const firebaseConfig = { apiKey: "AIzaSyARz3WftjUZ_fRoHn4EcL6k9BGlLNiyMA", authDomain: "note-15380.firebaseapp.com", databaseURL: "https://note-15380-default-rtdb.firebaseio.com/", projectId: "note-15380", storageBucket: "note-15380.firebasestorage.app", messagingSenderId: "834783700925", appId: "1:834783700925:web:63768ddccd55b6c55a94d4" };
        firebase.initializeApp(firebaseConfig);
        const db = firebase.database();

        let currentUser = localStorage.getItem('note_user_id') || "";
        let currentPin = localStorage.getItem('note_user_pin') || "";

        const wall = document.getElementById('wall');
        const viewport = document.getElementById('viewport');
        let wallLeft = 0, wallTop = 0, scale = 1, isPanning = false, startX, startY;

        if(currentUser) document.getElementById('user-id-input').value = currentUser;
        if(currentPin) document.getElementById('user-pin-input').value = currentPin;

        function login() {
            currentUser = document.getElementById('user-id-input').value.trim();
            currentPin = document.getElementById('user-pin-input').value.trim();
            if(!currentUser || currentPin.length < 4) return alert("Nhập đủ ID và PIN!");
            localStorage.setItem('note_user_id', currentUser);
            localStorage.setItem('note_user_pin', currentPin);
            document.getElementById('splash-screen').style.opacity = '0';
            setTimeout(() => { document.getElementById('splash-screen').style.display = 'none'; loadNotes(); updateLeaderboard(); }, 500);
        }

        // --- GIỮ NGUYÊN HÀM CŨ CỦA LÂM ---
        function updateWallTransform() { wall.style.transform = `translate(${wallLeft}px, ${wallTop}px) scale(${scale})`; }

        viewport.addEventListener('mousedown', (e) => {
            if(e.target !== viewport && e.target !== wall) return;
            isPanning = true; startX = e.clientX - wallLeft; startY = e.clientY - wallTop;
        });
        window.addEventListener('mousemove', (e) => {
            if (!isPanning) return;
            wallLeft = e.clientX - startX; wallTop = e.clientY - startY;
            updateWallTransform();
        });
        window.addEventListener('mouseup', () => isPanning = false);
        window.addEventListener('wheel', (e) => {
            e.preventDefault(); scale = Math.min(Math.max(0.1, scale - e.deltaY * 0.001), 4);
            updateWallTransform();
        }, {passive: false});

        // --- RANKING ---
        function updateLeaderboard() {
            db.ref('ranking').orderByChild('time').limitToLast(5).on('value', snap => {
                const list = document.getElementById('rank-list'); list.innerHTML = "";
                let ranks = []; snap.forEach(c => ranks.push(c.val()));
                ranks.reverse().forEach((u, i) => {
                    list.innerHTML += `<div class="rank-item"><span>${i+1}. ${u.name}</span> <span>${(u.time/3600).toFixed(1)}h</span></div>`;
                });
            });
        }

        let timerSeconds = 0, timerInterval = null;
        function updateTimerUI() {
            const h = Math.floor(timerSeconds/3600).toString().padStart(2,'0');
            const m = Math.floor((timerSeconds%3600)/60).toString().padStart(2,'0');
            const s = (timerSeconds%60).toString().padStart(2,'0');
            document.getElementById('timer-display').innerText = `${h}:${m}:${s}`;
        }
        function startTimer() { if(!timerInterval) timerInterval = setInterval(() => { timerSeconds++; updateTimerUI(); }, 1000); }
        function stopTimer() {
            clearInterval(timerInterval); timerInterval = null;
            const ref = db.ref(`ranking/${currentUser}_${currentPin}`);
            ref.once('value').then(s => {
                const total = (s.val()?.time || 0) + timerSeconds;
                ref.set({ name: currentUser, time: total });
                const t = document.getElementById('study-toast'); t.innerText = `${currentUser} đã học xong!`;
                t.style.display = 'block'; setTimeout(() => t.style.display = 'none', 2000);
                timerSeconds = 0; updateTimerUI();
            });
        }

        let globalPath = "notes";
        function toggleMode() {
            const s = document.getElementById('room-status');
            const isP = (s.innerText === 'CÔNG CỘNG');
            s.innerText = isP ? 'CÁ NHÂN' : 'CÔNG CỘNG';
            s.style.color = isP ? '#ff00ff' : '#00ff00';
            loadNotes();
        }

        function loadNotes() {
            if (globalPath) db.ref(globalPath).off();
            globalPath = (document.getElementById('room-status').innerText === 'CÁ NHÂN') ? `notes/private/${currentUser}_${currentPin}` : 'notes';
            db.ref(globalPath).on('value', snap => {
                wall.innerHTML = ""; const data = snap.val();
                if(data) Object.keys(data).forEach(id => renderNote(id, data[id], globalPath));
            });
        }

        // --- HÀM RENDER NOTE GỐC ---
        function renderNote(id, item, path) {
            const note = document.createElement('div');
            note.className = 'sticky-note';
            note.style.cssText = `left:${item.x}; top:${item.y}; width:${item.w}; height:${item.h}; background:${item.color};`;
            note.contentEditable = "true"; note.innerText = item.text || "";
            note.onblur = () => db.ref(`${path}/${id}`).update({ text: note.innerText, w: note.style.width, h: note.style.height });
            note.oncontextmenu = (e) => { e.preventDefault(); if(confirm("Xóa?")) db.ref(`${path}/${id}`).remove(); };
            
            let oX, oY;
            note.onmousedown = (e) => {
                if(e.offsetX > note.offsetWidth - 20) return;
                oX = e.clientX - note.offsetLeft; oY = e.clientY - note.offsetTop;
                const move = (ev) => { note.style.left = (ev.clientX - oX) + 'px'; note.style.top = (ev.clientY - oY) + 'px'; };
                const stop = () => { db.ref(`${path}/${id}`).update({ x: note.style.left, y: note.style.top }); window.removeEventListener('mousemove', move); window.removeEventListener('mouseup', stop); };
                window.addEventListener('mousemove', move); window.addEventListener('mouseup', stop);
            };
            wall.appendChild(note);
        }

        function sendToCloud() {
            const input = document.getElementById('note-input'); if (!input.value.trim()) return;
            db.ref(globalPath).push({ text: input.value, x: (Math.abs(wallLeft)+150)/scale+'px', y: (Math.abs(wallTop)+150)/scale+'px', w: "180px", h: "auto", color: document.getElementById('color-picker').value });
            input.value = "";
        }
    </script>
</body>
</html>
