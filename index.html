<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Free Note - made by bad guy</title>
    <link rel="icon" href="unnamed-1.jpg">
    <script src="https://www.gstatic.com/firebasejs/9.15.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.15.0/firebase-database-compat.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/hammer.js/2.0.8/hammer.min.js"></script>
    <style>
        body { background-color: #000; margin: 0; padding: 0; font-family: sans-serif; overflow: hidden; color: white; touch-action: none; }
        #guide-box { position: fixed; top: 20px; left: 20px; width: fit-content; background: rgba(30, 30, 30, 0.9); border: 1px solid #444; border-radius: 10px; padding: 12px 18px; z-index: 2000; font-size: 13px; }
        #guide-box h3 { margin: 0 0 5px 0; color: #00ff00; font-size: 16px; }
        #viewport { width: 100vw; height: 100vh; position: relative; overflow: hidden; background: #000; }
        #wall { position: absolute; width: 10000px; height: 10000px; top: 0; left: 0; background-image: radial-gradient(#333 1px, transparent 1px); background-size: 50px 50px; transform-origin: 0 0; }
        
        .sticky-note { width: 180px; min-height: 80px; padding: 10px; position: absolute; color: #000; border-radius: 8px; box-shadow: 0 4px 10px rgba(0,0,0,0.5); font-size: 14px; cursor: move; outline: none; word-wrap: break-word; z-index: 100; touch-action: none; }
        .sticky-note img { width: 100%; border-radius: 5px; margin-top: 8px; pointer-events: none; display: block; }

        #dock { position: fixed; bottom: 0; width: 100%; height: 110px; background: rgba(15, 15, 15, 0.95); border-top: 1px solid #333; display: flex; justify-content: center; align-items: center; gap: 8px; z-index: 1000; padding: 0 5px; box-sizing: border-box; }
        #user-id-input { background: #222; border: 1px solid #444; color: #00ff00; padding: 5px; border-radius: 5px; width: 60px; text-align: center; font-size: 11px; }
        #note-input { width: 100px; height: 60px; border-radius: 5px; border: none; padding: 8px; font-size: 14px; }
        .btn { border: none; font-weight: bold; border-radius: 5px; height: 60px; cursor: pointer; }
        #add-btn { background: #fff; color: #000; padding: 0 12px; }
        #img-btn { background: #333; color: #fff; padding: 0 10px; font-size: 18px; border: 1px solid #555; }
        #room-btn { background: #222; color: #888; border: 1px solid #444; padding: 8px; border-radius: 8px; cursor: pointer; text-align: center; font-size: 10px; }
    </style>
</head>
<body>
    <div id="guide-box">
        <h3>UPDATE - 41 🧶</h3>
        <p>developed by Tung Lam</p>
    </div>
    
    <div id="viewport"><div id="wall"></div></div>
    
    <div id="dock">
        <div id="room-btn" onclick="toggleMode()">Phòng <br> <span id="room-status" style="color: #00ff00;">CÔNG CỘNG</span></div>
        <div style="display:flex; flex-direction:column; gap:4px;">
            <input type="text" id="user-id-input" placeholder="ID...">
        </div>
        <textarea id="note-input" placeholder="Note..."></textarea>
        <input type="file" id="file-input" accept="image/*" style="display: none;" onchange="uploadImage(this)">
        <button id="img-btn" class="btn" onclick="document.getElementById('file-input').click()">🖼️</button>
        <input type="color" id="color-picker" value="#ffffff" style="width: 30px; height: 30px; border:none;">
        <button id="add-btn" class="btn" onclick="sendToCloud()">DÁN</button>
    </div>

    <script>
        // --- FIREBASE CONFIG (GIỮ NGUYÊN) ---
        const firebaseConfig = {
            apiKey: "AIzaSyARz3WftjUZ_fRoHn4EcL6k9BGlLNiyMA",
            authDomain: "note-15380.firebaseapp.com",
            databaseURL: "https://note-15380-default-rtdb.firebaseio.com/", 
            projectId: "note-15380",
            storageBucket: "note-15380.firebasestorage.app",
            messagingSenderId: "834783700925",
            appId: "1:834783700925:web:63768ddccd55b6c55a94d4"
        };
        firebase.initializeApp(firebaseConfig);
        const db = firebase.database();

        let currentUserId = localStorage.getItem('note_user_id') || 'user_' + Math.random().toString(36).substr(2, 5);
        document.getElementById('user-id-input').value = currentUserId;

        const wall = document.getElementById('wall');
        const viewport = document.getElementById('viewport');
        let wallLeft = 0, wallTop = 0, scale = 1;

        function updateWallTransform() { 
            wall.style.transform = `translate(${wallLeft}px, ${wallTop}px) scale(${scale})`; 
        }

        // --- XỬ LÝ ZOOM & PAN CHO MOBILE (DÙNG HAMMER.JS) ---
        const mc = new Hammer.Manager(viewport);
        const pan = new Hammer.Pan();
        const pinch = new Hammer.Pinch();
        mc.add([pan, pinch]);

        let lastX = 0, lastY = 0, lastScale = 1;

        // Kéo nền (Pan)
        mc.on("panstart", () => { lastX = wallLeft; lastY = wallTop; });
        mc.on("panmove", (e) => {
            if (e.target === viewport || e.target === wall) {
                wallLeft = lastX + e.deltaX;
                wallTop = lastY + e.deltaY;
                updateWallTransform();
            }
        });

        // Thu phóng (Pinch)
        mc.on("pinchstart", () => { lastScale = scale; });
        mc.on("pinchmove", (e) => {
            scale = Math.min(Math.max(0.1, lastScale * e.scale), 4);
            updateWallTransform();
        });

        // Cuộn chuột cho PC
        window.addEventListener('wheel', (e) => {
            e.preventDefault();
            scale -= e.deltaY * 0.001;
            scale = Math.min(Math.max(0.1, scale), 4);
            updateWallTransform();
        }, {passive: false});

        // --- LOGIC PHÒNG & NOTE (GIỮ NGUYÊN TỪ BẢN TRƯỚC) ---
        let globalPath = "notes"; 
        function toggleMode() {
            const status = document.getElementById('room-status');
            const isToPrivate = (status.innerText === 'CÔNG CỘNG');
            status.innerText = isToPrivate ? 'CÁ NHÂN' : 'CÔNG CỘNG';
            status.style.color = isToPrivate ? '#ff00ff' : '#00ff00';
            loadNotes();
        }

        function loadNotes() {
            const typedId = document.getElementById('user-id-input').value.trim() || currentUserId;
            localStorage.setItem('note_user_id', typedId);
            if (globalPath) db.ref(globalPath).off();
            globalPath = (document.getElementById('room-status').innerText === 'CÁ NHÂN') ? `notes/private/${typedId}` : 'notes';
            db.ref(globalPath).on('value', (snapshot) => {
                wall.innerHTML = "";
                const data = snapshot.val();
                if(data) {
                    Object.keys(data).forEach(id => {
                        if (id !== 'private') renderNote(id, data[id], globalPath);
                    });
                }
            });
        }

        function renderNote(id, item, currentPath) {
            const note = document.createElement('div');
            note.className = 'sticky-note';
            note.contentEditable = "true";
            note.style.left = item.x || "100px";
            note.style.top = item.y || "100px";
            note.style.backgroundColor = item.color || '#fff';
            note.innerText = item.text || "";
            if (item.image) {
                const img = document.createElement('img');
                img.src = item.image;
                note.appendChild(img);
            }
            
            // Xóa note (DblClick/Tap)
            let isDeleting = false;
            const deleteMe = () => { if(confirm("Xóa nhé?")) { isDeleting = true; db.ref(`${currentPath}/${id}`).remove().then(() => note.remove()); } };
            note.ondblclick = deleteMe;
            let lastTap = 0;
            note.addEventListener('touchend', (e) => {
                const now = Date.now();
                if (now - lastTap < 300) { e.preventDefault(); deleteMe(); }
                lastTap = now;
            });

            note.onblur = () => { if(!isDeleting) db.ref(`${currentPath}/${id}`).update({ text: note.innerText }); };
            makeDraggable(note, id, currentPath);
            wall.appendChild(note);
        }

        function makeDraggable(el, id, path) {
            let hammerNote = new Hammer(el);
            hammerNote.on("pan", (e) => {
                el.style.left = (parseFloat(el.style.left) + e.velocity.x * 10) + 'px';
                el.style.top = (parseFloat(el.style.top) + e.velocity.y * 10) + 'px';
            });
            hammerNote.on("panend", () => {
                db.ref(`${path}/${id}`).update({ x: el.style.left, y: el.style.top });
            });
        }

        function uploadImage(input) {
            const file = input.files[0];
            if (!file) return;
            const reader = new FileReader();
            reader.onload = (e) => {
                const img = new Image();
                img.src = e.target.result;
                img.onload = () => {
                    const canvas = document.createElement('canvas');
                    const maxW = 400;
                    canvas.width = maxW;
                    canvas.height = img.height * (maxW / img.width);
                    canvas.getContext('2d').drawImage(img, 0, 0, canvas.width, canvas.height);
                    db.ref(globalPath).push({
                        text: "Hình ảnh",
                        image: canvas.toDataURL('image/jpeg', 0.6),
                        x: (Math.abs(wallLeft) + 200) / scale + 'px',
                        y: (Math.abs(wallTop) + 200) / scale + 'px',
                        color: document.getElementById('color-picker').value
                    });
                    input.value = "";
                };
            };
            reader.readAsDataURL(file);
        }

        function sendToCloud() {
            const input = document.getElementById('note-input');
            if (!input.value.trim()) return;
            db.ref(globalPath).push({
                text: input.value,
                x: (Math.abs(wallLeft) + 150) / scale + 'px',
                y: (Math.abs(wallTop) + 150) / scale + 'px',
                color: document.getElementById('color-picker').value
            }).then(() => { input.value = ""; });
        }
        loadNotes();
    </script>
</body>
</html>
