<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=yes">
    <title>Free Note - made by bad guy</title>
    <link rel="icon" href="unnamed-1.jpg">
    <script src="https://www.gstatic.com/firebasejs/9.15.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.15.0/firebase-database-compat.js"></script>
    <style>
        body { 
            background-color: #000; margin: 0; padding: 0;
            font-family: sans-serif; overflow: hidden; color: white; 
            touch-action: none; 
        }
        #guide-box {
            position: fixed; top: 20px; left: 20px;
            width: fit-content; background: rgba(30, 30, 30, 0.9);
            border: 1px solid #444; border-radius: 10px;
            padding: 12px 18px; z-index: 2000; font-size: 13px;
        }
        #guide-box h3 { margin: 0 0 5px 0; color: #00ff00; font-size: 16px; }
        #guide-box p { margin: 0; color: #bbb; }
        .admin-link { color: #00ff00; text-decoration: none; font-weight: bold; }
        #viewport { width: 100vw; height: 100vh; cursor: grab; position: relative; overflow: hidden; }
        #wall { 
            position: absolute; width: 10000px; height: 10000px; 
            top: 0; left: 0; 
            background-image: radial-gradient(#333 1px, transparent 1px);
            background-size: 50px 50px; 
            transform-origin: 0 0;
        }
        .sticky-note {
            width: 170px; min-height: 100px; padding: 12px;
            position: absolute; color: #000; border-radius: 8px;
            box-shadow: 0 4px 10px rgba(0,0,0,0.5);
            font-size: 14px; cursor: move; outline: none; word-wrap: break-word;
            z-index: 100; touch-action: none;
        }
        #dock {
            position: fixed; bottom: 0; width: 100%; height: 110px;
            background: rgba(15, 15, 15, 0.95); border-top: 1px solid #333;
            display: flex; justify-content: center; align-items: center; gap: 10px; z-index: 1000;
        }
        .input-group { display: flex; flex-direction: column; gap: 4px; }
        #user-id-input { background: #222; border: 1px solid #444; color: #00ff00; padding: 6px; border-radius: 5px; width: 70px; text-align: center; font-size: 12px; }
        #note-input { width: 120px; height: 60px; border-radius: 5px; border: none; padding: 8px; font-size: 14px; }
        #add-btn { background: #fff; color: #000; border: none; padding: 0 15px; font-weight: bold; border-radius: 5px; height: 60px; cursor: pointer; }
        #room-btn { background: #222; color: #888; border: 1px solid #444; padding: 10px; border-radius: 8px; cursor: pointer; text-align: center; font-size: 12px; }
    </style>
</head>
<body>
    <div id="guide-box">
        <h3>UPDATE.37 👽</h3>
        <p>developed by <a href="https://www.facebook.com/profile.php?id=61585891402987" target="_blank" class="admin-link">Tung Lam</a></p>
    </div>
    
    <div id="viewport"><div id="wall"></div></div>
    
    <div id="dock">
        <div id="room-btn" onclick="toggleMode()">Phòng <br> <span id="room-status" style="color: #00ff00;">CÔNG CỘNG</span></div>
        <div class="input-group"><span style="font-size: 9px; color: #777;">MÃ ID:</span><input type="text" id="user-id-input" placeholder="Mã..."></div>
        <textarea id="note-input" placeholder="Viết gì đó..."></textarea>
        <input type="color" id="color-picker" value="#ffffff" style="width: 35px; height: 35px; border:none; cursor: pointer;">
        <button id="add-btn" onclick="sendToCloud()">DÁN</button>
    </div>

    <script>
        const firebaseConfig = {
            apiKey: "AIzaSyARz3WftjUZ_fRoHn4EcL6k9BGlLNiyMA",
            authDomain: "note-15380.firebaseapp.com",
            databaseURL: "https://note-15380-default-rtdb.firebaseio.com/", 
            projectId: "note-15380",
            storageBucket: "note-15380.firebasestorage.app",
            messagingSenderId: "834783700925",
            appId: "1:834783700925:web:63768ddccd55b6c55a94d4"
        };
        firebase.initializeApp(firebaseConfig);
        const db = firebase.database();

        let currentUserId = localStorage.getItem('note_user_id') || 'user_' + Math.random().toString(36).substr(2, 5);
        document.getElementById('user-id-input').value = currentUserId;

        let wallLeft = 0, wallTop = 0, scale = 1, isPanning = false, startX, startY;
        const wall = document.getElementById('wall');
        const viewport = document.getElementById('viewport');

        function updateWallTransform() { wall.style.transform = `translate(${wallLeft}px, ${wallTop}px) scale(${scale})`; }

        
        const startDrag = (e) => {
            if(e.target !== viewport && e.target !== wall) return;
            isPanning = true;
            const cX = e.touches ? e.touches[0].clientX : e.clientX;
            const cY = e.touches ? e.touches[0].clientY : e.clientY;
            startX = cX - wallLeft; startY = cY - wallTop;
        };
        const moveDrag = (e) => {
            if (!isPanning) return;
            const cX = e.touches ? e.touches[0].clientX : e.clientX;
            const cY = e.touches ? e.touches[0].clientY : e.clientY;
            wallLeft = cX - startX; wallTop = cY - startY;
            updateWallTransform();
        };
        viewport.addEventListener('mousedown', startDrag);
        window.addEventListener('mousemove', moveDrag);
        window.addEventListener('mouseup', () => isPanning = false);
        viewport.addEventListener('touchstart', startDrag);
        window.addEventListener('touchmove', moveDrag, {passive: false});
        window.addEventListener('touchend', () => isPanning = false);

        window.addEventListener('wheel', (e) => {
            e.preventDefault();
            scale -= e.deltaY * 0.001;
            scale = Math.min(Math.max(0.2, scale), 3);
            updateWallTransform();
        }, {passive: false});

        function toggleMode() {
            const status = document.getElementById('room-status');
            const isToPrivate = (status.innerText === 'CÔNG CỘNG');
            status.innerText = isToPrivate ? 'CÁ NHÂN' : 'CÔNG CỘNG';
            status.style.color = isToPrivate ? '#ff00ff' : '#00ff00';
            loadNotes();
        }

        let lastPath = "";
        function loadNotes() {
            const statusText = document.getElementById('room-status').innerText;
            const typedId = document.getElementById('user-id-input').value.trim() || currentUserId;
            localStorage.setItem('note_user_id', typedId);
            if (lastPath) db.ref(lastPath).off();
            const path = (statusText === 'CÁ NHÂN') ? `notes/private/${typedId}` : 'notes';
            lastPath = path;

            db.ref(path).on('value', (snapshot) => {
                wall.innerHTML = "";
                const data = snapshot.val();
                if(data) {
                    Object.keys(data).forEach(id => {
                        if(data[id]) renderNote(id, data[id], path);
                    });
                }
            });
        }

        function renderNote(id, item, currentPath) {
            const note = document.createElement('div');
            note.className = 'sticky-note';
            note.contentEditable = "true";
            note.innerText = item.text;
            note.style.left = item.x;
            note.style.top = item.y;
            note.style.backgroundColor = item.color || '#fff';
            
            let isDeleting = false; 

            const deleteMe = () => {
                if(confirm("xác nhận xoá ?")) {
                    isDeleting = true; 
                    db.ref(currentPath).off();
                    db.ref(`${currentPath}/${id}`).remove().then(() => {
                        note.remove(); 
                        setTimeout(loadNotes, 400);
                    }).catch(err => {
                        isDeleting = false;
                        loadNotes(); 
                    });
                }
            };

            note.ondblclick = (e) => { e.stopPropagation(); deleteMe(); };
            
            let lastTap = 0;
            note.addEventListener('touchend', (e) => {
                const now = new Date().getTime();
                if (now - lastTap < 300 && now - lastTap > 0) { 
                    e.preventDefault(); deleteMe(); 
                }
                lastTap = now;
            });

            note.onblur = () => {
                if(!isDeleting && note.innerText.trim() !== "") {
                    db.ref(`${currentPath}/${id}`).update({ text: note.innerText });
                }
            };

            makeDraggable(note, id, currentPath);
            wall.appendChild(note);
        }

        function makeDraggable(el, id, path) {
            let oX, oY;
            const start = (e) => {
                if(document.activeElement === el) return;
                const cX = e.touches ? e.touches[0].clientX : e.clientX;
                const cY = e.touches ? e.touches[0].clientY : e.clientY;
                oX = cX - el.offsetLeft; oY = cY - el.offsetTop;
                const move = (ev) => {
                    const mX = ev.touches ? ev.touches[0].clientX : ev.clientX;
                    const mY = ev.touches ? ev.touches[0].clientY : ev.clientY;
                    el.style.left = (mX - oX) + 'px';
                    el.style.top = (mY - oY) + 'px';
                };
                const stop = () => {
                    db.ref(`${path}/${id}`).update({ x: el.style.left, y: el.style.top });
                    window.removeEventListener('mousemove', move); window.removeEventListener('mouseup', stop);
                    window.removeEventListener('touchmove', move); window.removeEventListener('touchend', stop);
                };
                window.addEventListener(e.touches ? 'touchmove' : 'mousemove', move);
                window.addEventListener(e.touches ? 'touchend' : 'mouseup', stop);
            };
            el.addEventListener('mousedown', start);
            el.addEventListener('touchstart', start);
        }

        function sendToCloud() {
            const input = document.getElementById('note-input');
            if (!input.value.trim()) return;
            db.ref(lastPath).push({
                text: input.value,
                x: (Math.abs(wallLeft) + 100) / scale + 'px',
                y: (Math.abs(wallTop) + 100) / scale + 'px',
                color: document.getElementById('color-picker').value
            });
            input.value = "";
        }
        loadNotes();
    </script>
</body>
</html>
