<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <title>Free note - made by bad guy</title>
    <link rel="icon" href="unnamed-1.jpg">
    <script src="https://www.gstatic.com/firebasejs/9.15.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.15.0/firebase-database-compat.js"></script>
    <style>
        body { background-color: #000; margin: 0; overflow: hidden; font-family: sans-serif; color: white; }
        #viewport { width: 100vw; height: 100vh; position: relative; overflow: hidden; cursor: grab; }
        #wall { position: absolute; width: 5000px; height: 5000px; top: 0; left: 0; background-image: radial-gradient(#333 1px, transparent 1px); background-size: 40px 40px; }
        .sticky-note {
            width: 150px; min-height: 100px; padding: 15px; position: absolute; color: #000;
            box-shadow: 0 4px 15px rgba(255,255,255,0.2); word-wrap: break-word; 
            font-size: 14px; border-radius: 8px; cursor: move; outline: none;
        }
        #dock {
            width: 100vw; height: 130px; background: rgba(17,17,17,0.9); border-top: 1px solid #333;
            display: flex; justify-content: center; align-items: center; gap: 10px; position: fixed; bottom: 0; z-index: 1000;
        }
        /* NÚT THẦN THÁNH ĐÂY */
        #rescue-btn {
            background: #ff4757; color: white; border: none; padding: 10px; 
            border-radius: 5px; font-weight: bold; cursor: pointer; position: fixed; top: 20px; right: 20px; z-index: 2000;
        }
        #note-input { width: 200px; height: 60px; border-radius: 5px; border: none; padding: 5px; }
        #add-btn { background: #fff; border: none; padding: 15px; font-weight: bold; border-radius: 5px; cursor: pointer; }
    </style>
</head>
<body>

    <button id="rescue-btn" onclick="rescueNotes()"> MẤT NOTE ROII 🆘</button>

    <div id="viewport">
        <div id="wall"></div>
    </div>

    <div id="dock">
        <div style="text-align:center">
            <button onclick="toggleMode()" style="background:#222; color:#00ff00; border:1px solid #444; padding:10px; border-radius:5px; cursor:pointer;">
                PHÒNG: <span id="room-text">CÔNG CỘNG</span>
            </button>
        </div>
        <input type="text" id="user-id-input" placeholder="Mã ID" style="width:80px; background:#222; color:#00ff00; border:1px solid #444; padding:5px;" onchange="updateUserId(this.value)">
        <textarea id="note-input" placeholder="Viết gì đó..."></textarea>
        <button id="add-btn" onclick="sendToCloud()">DÁN</button>
    </div>

    <script>
        const firebaseConfig = {
            apiKey: "AIzaSyARz3WftjUZ_fRoHn4EcL6k9BGlLNiyMA",
            authDomain: "note-15380.firebaseapp.com",
            databaseURL: "https://note-15380-default-rtdb.firebaseio.com/", 
            projectId: "note-15380",
            storageBucket: "note-15380.firebasestorage.app",
            messagingSenderId: "834783700925",
            appId: "1:834783700925:web:63768ddccd55b6c55a94d4"
        };
        firebase.initializeApp(firebaseConfig);
        const db = firebase.database();

        let userId = localStorage.getItem('note_user_id') || 'user_' + Math.random().toString(36).substr(2, 5);
        document.getElementById('user-id-input').value = userId;
        
        let wallLeft = 0, wallTop = 0;
        const wall = document.getElementById('wall');

        // HÀM TRIỆU HỒI: ÉP TẤT CẢ NOTE VỀ VỊ TRÍ (50, 50) CỦA MÀN HÌNH HIỆN TẠI
        function rescueNotes() {
            if(!confirm("Hệ thống sẽ kéo tất cả note về vị trí bạn đang nhìn. Bạn đồng ý chứ?")) return;
            const activePath = currentPath;
            db.ref(activePath).once('value', (snapshot) => {
                const data = snapshot.val();
                if(!data) { alert("Không tìm thấy dữ liệu nào!"); return; }
                
                Object.keys(data).forEach((id, index) => {
                    // Xếp chồng nhẹ lên nhau ở góc trái màn hình hiện tại
                    db.ref(`${activePath}/${id}`).update({
                        x: (Math.abs(wallLeft) + 50 + (index * 10)) + 'px',
                        y: (Math.abs(wallTop) + 50 + (index * 10)) + 'px'
                    });
                });
                alert("Đã triệu hồi xong! Kiểm tra góc màn hình nhé.");
            });
        }

        // ... (Giữ nguyên các hàm di chuyển nền, dán note và load note như bản trước) ...
        let isPrivate = false; let currentPath = 'notes';

        function updateUserId(val) { userId = val; localStorage.setItem('note_user_id', userId); loadNotes(); }
        
        function toggleMode() {
            isPrivate = !isPrivate;
            currentPath = isPrivate ? `notes/private/${userId}` : 'notes';
            document.getElementById('room-text').innerText = isPrivate ? 'CÁ NHÂN' : 'CÔNG CỘNG';
            loadNotes();
        }

        function loadNotes() {
            db.ref(currentPath).on('value', (snapshot) => {
                wall.innerHTML = "";
                const data = snapshot.val();
                if(!data) return;
                Object.keys(data).forEach(id => {
                    const note = document.createElement('div');
                    note.className = 'sticky-note';
                    note.contentEditable = "true";
                    note.innerText = data[id].text;
                    note.style.left = data[id].x; note.style.top = data[id].y;
                    note.style.backgroundColor = data[id].color || '#fff';
                    note.onblur = () => db.ref(`${currentPath}/${id}`).update({ text: note.innerText });
                    note.ondblclick = () => { if(confirm("Xóa?")) db.ref(`${currentPath}/${id}`).remove(); };
                    makeDraggable(note, id);
                    wall.appendChild(note);
                });
            });
        }

        function makeDraggable(el, id) {
            el.onmousedown = (e) => {
                if(document.activeElement === el) return;
                let sX = e.clientX - el.offsetLeft, sY = e.clientY - el.offsetTop;
                window.onmousemove = (ev) => {
                    el.style.left = (ev.clientX - sX) + 'px'; el.style.top = (ev.clientY - sY) + 'px';
                };
                window.onmouseup = () => {
                    db.ref(`${currentPath}/${id}`).update({ x: el.style.left, y: el.style.top });
                    window.onmousemove = null;
                };
            };
        }

        function sendToCloud() {
            const input = document.getElementById('note-input');
            if (!input.value.trim()) return;
            db.ref(currentPath).push({
                text: input.value,
                x: (Math.abs(wallLeft) + 100) + 'px',
                y: (Math.abs(wallTop) + 100) + 'px',
                color: '#fff'
            });
            input.value = "";
        }

        // Di chuyển nền
        document.getElementById('viewport').onmousedown = (e) => {
            if(e.target.id !== 'viewport' && e.target.id !== 'wall') return;
            let sX = e.clientX - wallLeft, sY = e.clientY - wallTop;
            window.onmousemove = (ev) => {
                wallLeft = ev.clientX - sX; wallTop = ev.clientY - sY;
                wall.style.left = wallLeft + 'px'; wall.style.top = wallTop + 'px';
            };
            window.onmouseup = () => window.onmousemove = null;
        };

        loadNotes();
    </script>
</body>
</html>
